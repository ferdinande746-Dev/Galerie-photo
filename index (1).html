<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma galerie photo</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="galerie">
    <h1>Ma galerie photo</h1>
    <p class="intro">Survole ou clique sur une photo pour l’agrandir.</p>

    <section
      id="image"
      class="image-principale"
      aria-live="polite"
    >
      Sélectionne une photo
    </section>

    <section class="miniatures" aria-label="Photos de la galerie">
      <img
        class="preview"
        src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80"
        alt="Montagnes brumeuses au lever du soleil"
        tabindex="0"
      >

      <img
        class="preview"
        src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80"
        alt="Lac calme entouré de montagnes"
        tabindex="0"
      >

      <img
        class="preview"
        src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=800&q=80"
        alt="Forêt verdoyante traversée par un chemin"
        tabindex="0"
      >

      <img
        class="preview"
        src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80"
        alt="Plage et océan bleu vus du ciel"
        tabindex="0"
      >
    </section>
  </main>

  <script src="JavaScriptUne galerie photo simple et responsive créée avec HTML, CSS et JavaScript. Les images peuvent être affichées en grand au survol, au clic ou avec le clavier..js"></script>
</body>
</html>
